trigger:
 branches:
   include:
     - none 
     
pool:
   name: ARJUN



parameters:
  - name: env
    default: dev
    type: string
    values:
      - dev 
      - qa
      - prod


variables:
    - name: wd
      value: '$(Build.SourcesDirectory)/Root Module/${{parameters.env}}'
 
    - ${{if eq(parameters.env,'dev')}}:
      - group: vg-dev         
    - ${{if eq(parameters.env,'qa')}}: 
      - group: vg-qa
    - ${{if eq(parameters.env, 'prod')}} :
      - group: vg-prod

stages:
  - stage: Build 
    displayName: 'Build and Security Scan'
    jobs:
      - job:  
        displayName: 'Build Code'
        steps:
          - task: TerraformTask@5
            displayName: 'init'
            inputs:
             provider: 'azurerm'
             command: 'init'
             workingDirectory: '$(wd)'
             backendServiceArm: 'Arjun-CI/CD-PIPELINE'
             backendAzureRmStorageAccountName: '$(storage)'
             backendAzureRmContainerName: '$(container)'
             backendAzureRmKey: '$(key)'
         
          - task: TerraformTask@5
            displayName: 'Code Format'
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: '$(wd)'
              outputTo: 'console'
              customCommand: 'fmt'
              environmentServiceNameAzureRM: 'Arjun-CI/CD-PIPELINE'