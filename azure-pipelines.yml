trigger:
 branches:
   include:
     - none 
     
pool:
   name: ARJUN



parameters:
  - name: env
    default: dev
    type: boolean
    values:
      - dev 
      - qa
      - prod


variables:
    - name: working directory
      value: '$(Build.SourcesDirectory)/Root Module/${{parameters.env}}'
    - name: key
      value: '${{parameters.env}}.terraform.tfstate'
    - name: storage
      value: pipelinestorageaccount13
    - name: rg
      value: backend_pipeline
    - name: container 
      value: arjun-tfstate
stages:
  - stage:               