trigger: none
pr: none

pool:
  name: ARJUN

parameters:
  - name: env
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - prod

variables:
  - ${{ if eq(parameters.env, 'dev') }}:
      - group: vg-dev
  - ${{ if eq(parameters.env, 'qa') }}:
      - group: vg-qa
  - ${{ if eq(parameters.env, 'prod') }}:
      - group: vg-prod

  - ${{ if eq(parameters.env, 'dev') }}:
      - name: wd
        value: '$(Build.SourcesDirectory)/Root Module/Dev'
  - ${{ if eq(parameters.env, 'qa') }}:
      - name: wd
        value: '$(Build.SourcesDirectory)/Root Module/QA'
  - ${{ if eq(parameters.env, 'prod') }}:
      - name: wd
        value: '$(Build.SourcesDirectory)/Root Module/Prod'

  - name: key
    value: '${{ parameters.env }}.terraform.tfstate'

  - name: ReportDir
    value: '$(Build.ArtifactStagingDirectory)/security-reports'

stages:
  - stage: Build
    displayName: 'Build - ${{ parameters.env }}'

    jobs:
      - job: TerraformBuild
        displayName: Terraform Init and Format

        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: Validate Terraform working directory
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'

                $wd = "$(wd)"

                if (-not (Test-Path -LiteralPath $wd -PathType Container)) {
                  throw "Terraform working directory not found: $wd"
                }

                $terraform = Get-Command terraform.exe -ErrorAction SilentlyContinue
                if (-not $terraform) {
                  $terraform = Get-Command terraform -ErrorAction SilentlyContinue
                }

                if (-not $terraform) {
                  throw "Terraform is not installed or not available in PATH."
                }

                & $terraform.Source version
                if ($LASTEXITCODE -ne 0) {
                  throw "Terraform version check failed."
                }

          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(wd)'
              backendServiceArm: 'Arjun-CI/CD-PIPELINE'
              backendAzureRmStorageAccountName: '$(storage)'
              backendAzureRmContainerName: '$(container)'
              backendAzureRmKey: '$(key)'

          - task: PowerShell@2
            displayName: Terraform Format Check
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location -LiteralPath "$(wd)"

                terraform fmt -check -recursive

                if ($LASTEXITCODE -ne 0) {
                  throw "Terraform formatting check failed. Run 'terraform fmt -recursive' and commit the changes."
                }

  - stage: SecurityScan
    displayName: 'Security Scan - ${{ parameters.env }}'
    dependsOn: Build

    jobs:
      - job: TerraformLint
        displayName: TFLint Validation

        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: Verify TFLint and Run Lint
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                $wd = "$(wd)"

                if (-not (Test-Path -LiteralPath $wd -PathType Container)) {
                  throw "Terraform directory not found: $wd"
                }

                $tflint = Get-Command tflint.exe -ErrorAction SilentlyContinue
                if (-not $tflint) {
                  $tflint = Get-Command tflint -ErrorAction SilentlyContinue
                }

                if (-not $tflint) {
                  throw "TFLint is not installed or not available in PATH."
                }

                & $tflint.Source --version
                if ($LASTEXITCODE -ne 0) {
                  throw "TFLint version check failed."
                }

                Set-Location -LiteralPath $wd

                & $tflint.Source --init
                if ($LASTEXITCODE -ne 0) {
                  throw "TFLint plugin initialization failed."
                }

                & $tflint.Source --recursive --minimum-failure-severity=error
                if ($LASTEXITCODE -ne 0) {
                  throw "TFLint detected errors."
                }

      - job: SecurityScan
        displayName: tfsec and Gitleaks
        timeoutInMinutes: 30

        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: false

          - task: PowerShell@2
            displayName: Verify Security Tools and Prepare Reports
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'

                $tfsec = Get-Command tfsec.exe -ErrorAction SilentlyContinue
                if (-not $tfsec) {
                  $tfsec = Get-Command tfsec -ErrorAction SilentlyContinue
                }

                $gitleaks = Get-Command gitleaks.exe -ErrorAction SilentlyContinue
                if (-not $gitleaks) {
                  $gitleaks = Get-Command gitleaks -ErrorAction SilentlyContinue
                }

                if (-not $tfsec) {
                  throw "tfsec is not installed or not available in PATH."
                }

                if (-not $gitleaks) {
                  throw "Gitleaks is not installed or not available in PATH."
                }

                & $tfsec.Source --version
                if ($LASTEXITCODE -ne 0) {
                  throw "tfsec version check failed."
                }

                & $gitleaks.Source version
                if ($LASTEXITCODE -ne 0) {
                  throw "Gitleaks version check failed."
                }

                New-Item -ItemType Directory `
                  -Path "$(ReportDir)" -Force | Out-Null

                Write-Host "##vso[task.setvariable variable=TFSEC_EXE]$($tfsec.Source)"
                Write-Host "##vso[task.setvariable variable=GITLEAKS_EXE]$($gitleaks.Source)"

          - task: PowerShell@2
            displayName: Gitleaks Secret Scan
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'

                $root = "$(Build.SourcesDirectory)"
                $config = Join-Path $root '.gitleaks.toml'
                $report = Join-Path "$(ReportDir)" 'gitleaks.json'

                if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
                  throw ".gitleaks.toml was not found at the repository root."
                }

                $gitleaksExe = if ($env:GITLEAKS_EXE) { $env:GITLEAKS_EXE } else { (Get-Command gitleaks.exe, gitleaks -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1) }
                if (-not $gitleaksExe) {
                  throw "Gitleaks executable not found."
                }

                & "$gitleaksExe" dir $root `
                  --config="$config" `
                  --redact `
                  --no-banner `
                  --report-format json `
                  --report-path "$report" `
                  --exit-code 1

                $scanExit = $LASTEXITCODE

                if ($scanExit -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Gitleaks failed or detected potential secrets. Review the redacted report."
                  exit $scanExit
                }

          - task: PowerShell@2
            displayName: tfsec Terraform Security Scan
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'

                $root = "$(Build.SourcesDirectory)"
                $report = Join-Path "$(ReportDir)" 'tfsec.json'

                $tfsecExe = if ($env:TFSEC_EXE) { $env:TFSEC_EXE } else { (Get-Command tfsec.exe, tfsec -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1) }
                if (-not $tfsecExe) {
                  throw "tfsec executable not found."
                }

                & "$tfsecExe" $root `
                  --format json `
                  --out "$report" `
                  --minimum-severity HIGH

                $scanExit = $LASTEXITCODE

                if ($scanExit -ne 0) {
                  Write-Host "##vso[task.logissue type=error]tfsec failed or detected security findings. Review the report."
                  exit $scanExit
                }

          - task: PowerShell@2
            displayName: Ensure Report Directory Exists
            condition: always()
            inputs:
              targetType: inline
              pwsh: false
              script: |
                if (-not (Test-Path -LiteralPath "$(ReportDir)")) {
                  New-Item -ItemType Directory -Path "$(ReportDir)" -Force | Out-Null
                }

          - task: PublishPipelineArtifact@1
            displayName: Publish Security Reports
            condition: always()
            inputs:
              targetPath: '$(ReportDir)'
              artifact: 'terraform-security-reports'
              publishLocation: pipeline
