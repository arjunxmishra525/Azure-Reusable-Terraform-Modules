trigger:
 branches:
   include:
     - none 
     
pool:
   name: ARJUN



parameters:
  - name: env
    default: dev
    type: string
    values:
      - dev 
      - qa
      - prod


variables:
    - name: wd
      value: '$(Build.SourcesDirectory)/Root Module/${{parameters.env}}'
    - name: key
      value: '${{parameters.env}}.terraform.tfstate'
    - name: storage
      value: pipelinestorageaccount13
    - name: rg
      value: backend_pipeline
    - name: container 
      value: arjun-tfstate
stages:
  - stage: Build 
    displayName: 'Build and Security Scan'
    jobs:
      - job:  
        displayName: 'Build Code'
        steps:
          - task: TerraformTask@5
            inputs:
             provider: 'azurerm'
             command: 'init'
             workingDirectory: '$(wd)'
             backendServiceArm: 'Arjun-CI/CD-PIPELINE'
             backendAzureRmStorageAccountName: '$(storage)'
             backendAzureRmContainerName: '$(container)'
             backendAzureRmKey: '$(key)'
         