trigger: none
pr: none

pool:
  name: ARJUN

parameters:
  - name: env
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - prod

variables:
  # The selected variable group must contain storage, container, and
  # vmadminpassword (mark vmadminpassword as secret).
  - ${{ if eq(parameters.env, 'dev') }}:
      - group: vg-dev
  - ${{ if eq(parameters.env, 'qa') }}:
      - group: vg-qa
  - ${{ if eq(parameters.env, 'prod') }}:
      - group: vg-prod

  - name: wd
    value: '$(Build.SourcesDirectory)/Root Module/${{ parameters.env }}'
  - name: key
    value: '${{ parameters.env }}.terraform.tfstate'
  - name: ReportDir
    value: '$(Build.ArtifactStagingDirectory)/security-reports'

stages:
  - stage: ValidateAndScan
    displayName: 'Validate and Security Scan - ${{ parameters.env }}'
    jobs:
      - job: TerraformChecks
        displayName: Terraform checks
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: false

          - task: PowerShell@2
            displayName: Verify tools and working directory
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                $wd = "$(wd)"
                if (-not (Test-Path -LiteralPath $wd -PathType Container)) {
                  throw "Terraform working directory not found: $wd"
                }

                foreach ($tool in @('terraform', 'tflint', 'tfsec', 'gitleaks')) {
                  $cmd = Get-Command "$tool.exe" -ErrorAction SilentlyContinue
                  if (-not $cmd) { $cmd = Get-Command $tool -ErrorAction SilentlyContinue }
                  if (-not $cmd) { throw "$tool is not installed or not available in PATH." }
                  Write-Host "$tool found at $($cmd.Source)"
                }

                New-Item -ItemType Directory -Path "$(ReportDir)" -Force | Out-Null

          - task: PowerShell@2
            displayName: Terraform Format and Validate
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location -LiteralPath "$(wd)"

                terraform fmt -check -recursive
                if ($LASTEXITCODE -ne 0) {
                  throw "Terraform format check failed. Run terraform fmt -recursive and commit the changes."
                }

                terraform init -backend=false -input=false
                if ($LASTEXITCODE -ne 0) { throw "Terraform init (backend disabled) failed." }

                terraform validate
                if ($LASTEXITCODE -ne 0) { throw "Terraform validation failed." }

          - task: PowerShell@2
            displayName: TFLint
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location -LiteralPath "$(wd)"
                tflint --init
                if ($LASTEXITCODE -ne 0) { throw "TFLint initialization failed." }

                tflint --recursive --minimum-failure-severity=error
                if ($LASTEXITCODE -ne 0) { throw "TFLint detected errors." }

          - task: PowerShell@2
            displayName: Gitleaks Secret Scan
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                $root = "$(Build.SourcesDirectory)"
                $config = Join-Path $root '.gitleaks.toml'
                $report = Join-Path "$(ReportDir)" 'gitleaks.json'

                if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
                  throw ".gitleaks.toml was not found at repository root."
                }

                # Scan working tree AND Git history. Do not print secret values.
                gitleaks git $root `
                  --config="$config" `
                  --redact `
                  --no-banner `
                  --report-format json `
                  --report-path "$report" `
                  --exit-code 1

                $scanExit = $LASTEXITCODE
                if ($scanExit -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Gitleaks found potential secrets or the scan failed. Review the redacted report artifact."
                  exit $scanExit
                }

          - task: PowerShell@2
            displayName: tfsec Terraform Security Scan
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                $root = "$(Build.SourcesDirectory)"
                $report = Join-Path "$(ReportDir)" 'tfsec.json'

                tfsec $root --format json --out "$report" --minimum-severity HIGH
                $scanExit = $LASTEXITCODE
                if ($scanExit -ne 0) {
                  Write-Host "##vso[task.logissue type=error]tfsec reported HIGH/CRITICAL findings or the scan failed."
                  exit $scanExit
                }

          - task: PublishPipelineArtifact@1
            displayName: Publish security reports
            condition: always()
            inputs:
              targetPath: '$(ReportDir)'
              artifact: 'terraform-security-reports'
              publishLocation: pipeline

  - stage: Plan
    displayName: 'Terraform Plan - ${{ parameters.env }}'
    dependsOn: ValidateAndScan
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: Terraform init and plan
        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: Verify plan prerequisites
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                if (-not (Test-Path -LiteralPath "$(wd)" -PathType Container)) {
                  throw "Terraform working directory not found: $(wd)"
                }
                if ([string]::IsNullOrWhiteSpace($env:TF_VAR_vm_admin_password)) {
                  throw "Required secret variable vmadminpassword is missing or empty. Check the selected variable group and mark it secret."
                }
            env:
              TF_VAR_vm_admin_password: $(vmadminpassword)

          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(wd)'
              backendServiceArm: 'Arjun-CI/CD-PIPELINE'
              backendAzureRmStorageAccountName: '$(storage)'
              backendAzureRmContainerName: '$(container)'
              backendAzureRmKey: '$(key)'
              commandOptions: '-input=false'

          - task: PowerShell@2
            displayName: Terraform Plan (validate secret injection)
            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location -LiteralPath "$(wd)"
                terraform plan -input=false -out="$(Build.ArtifactStagingDirectory)/${{ parameters.env }}.tfplan"
                if ($LASTEXITCODE -ne 0) { throw "Terraform plan failed." }
            env:
              TF_VAR_vm_admin_password: $(vmadminpassword)

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform plan
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/${{ parameters.env }}.tfplan'
              artifact: 'terraform-plan-${{ parameters.env }}'
              publishLocation: pipeline

# IMPORTANT:
# - Create .gitleaks.toml at repository root; use a reviewed config. Never commit real credentials.
# - In each vg-* group define secret vmadminpassword, plus storage and container.
# - Terraform variable must be named vm_admin_password (TF_VAR_vm_admin_password maps to it).
# - If your actual Terraform variable name differs, change both the HCL variable and TF_VAR_ name consistently.
# - This pipeline intentionally stops at plan; add protected environment approvals and apply of the reviewed saved plan separately.
