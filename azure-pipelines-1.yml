trigger: 
 branches:
   include:
     - none

pool:      
   ARJUN

parameters:
  - name: env
    default: Dev
    type: string
    values:
      - Dev
      - Prod
      - QA

variables:
 - ${{if eq(parameters.env,'dev')}} :
    - group: vg-dev-1

 - ${{if eq(parameters.env,'prod')}} :
    - group: vg-prod-1

 - ${{if eq(parameters.env,'qa')}} :
    - group: vg-qa-1

 -  name: wd
    value: '$(Build.SourcesDirectory)/Root Module/$(parameters.env)'


stages:
  - stage: 
    displayName: Init
    jobs:
      - job: 
        displayName: Init
        steps:
         - script: 
             terraform init
           workingDirectory: $(wd)
           
          
          


              